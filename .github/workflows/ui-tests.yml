# Arranca un emulador Android, recorre la app y guarda capturas de cada pantalla.
# Las capturas se publican en la rama "ui-screenshots" (y como artefacto del run).
name: Pruebas en emulador

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-tests
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Activar KVM (emulador rápido)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Preparar
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubDebug assembleGithubDebugAndroidTest -PappVersionName=99.0.0 --stacktrace

      - name: Pruebas en el emulador (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedGithubDebugAndroidTest -PappVersionName=99.0.0 --stacktrace

      - name: Resumen de fallos
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in glob.glob("app/build/outputs/androidTest-results/**/*.xml", recursive=True):
              for tc in ET.parse(f).getroot().iter("testcase"):
                  for fail in list(tc.findall("failure")) + list(tc.findall("error")):
                      text = (fail.text or fail.get("message") or "")[:1500]
                      msg = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title=Prueba {tc.get('classname','').split('.')[-1]}.{tc.get('name')}::{msg}")
                      n += 1
          print(f"{n} fallos")
          PY

      - name: Publicar capturas en la rama ui-screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          find app/build/outputs -path '*additional_output*' \( -name '*.png' -o -name '*.txt' \) -exec cp {} "$RUNNER_TEMP/shots/" \; || true
          cd "$RUNNER_TEMP/shots"
          ls -la
          if [ -z "$(ls -A)" ]; then echo "No hay capturas"; exit 0; fi
          echo "Capturas del commit ${GITHUB_SHA::7} ($(date -u '+%Y-%m-%d %H:%M UTC'))" > README.md
          git init -q -b ui-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Capturas ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-screenshots

      - name: Guardar capturas e informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-emulador
          path: |
            app/build/outputs/connected_android_test_additional_output/
            app/build/reports/androidTests/
          if-no-files-found: ignore
