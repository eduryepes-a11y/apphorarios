# Compila la app en cada push para comprobar que no hay errores.
name: Compilar

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar y pasar las pruebas unitarias
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleGithubDebug assemblePlayDebug testGithubDebugUnitTest --stacktrace 2>&1 | tee build.log

      # Si falla, publica los errores como anotaciones (visibles en la página del run)
      - name: Resumen de errores
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          lines = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          errs = [l for l in lines if re.match(r"^e: ", l) or "error:" in l or l.startswith("> ") or "What went wrong" in l
                  or " FAILED" in l or "AssertionError" in l or "expected:" in l]
          errs = errs[:60] or lines[-40:]
          for chunk in range(0, len(errs), 6):
              msg = "%0A".join(e.replace("%", "%25").replace("\r", "") for e in errs[chunk:chunk + 6])
              print(f"::error title=Compilación ({chunk // 6 + 1})::{msg}")
          PY

      - name: Guardar APK de depuración
        uses: actions/upload-artifact@v4
        with:
          name: horarios-debug
          path: app/build/outputs/apk/**/*.apk
