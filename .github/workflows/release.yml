# Al publicar una Release (p. ej. con el tag v1.1.0) compila el APK firmado
# y lo adjunta a esa Release. La app lo detecta y se actualiza desde ahí.
name: Publicar APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Versión desde el tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Versión: $VERSION"

      - name: Preparar la firma
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret KEYSTORE_BASE64. Mira el README (sección 'Publicar una versión')."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK firmado (GitHub) y AAB (Google Play)
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease bundlePlayRelease -PappVersionName="$VERSION" --stacktrace
          cp app/build/outputs/apk/github/release/app-github-release.apk "Horarios-v$VERSION.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "Horarios-v$VERSION-play.aab"

      - name: Adjuntar el APK a la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            Horarios-v${{ env.VERSION }}.apk
            Horarios-v${{ env.VERSION }}-play.aab
